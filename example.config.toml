# Example MCP config for Codex / Claude Desktop.
# Copy the [mcp_servers.vision] block into your MCP config.
# Backends: ollama (default), openai_compatible, anthropic, gemini.
# See README.md for backend-specific environment variables.

[mcp_servers.vision]
type = "stdio"
command = "uv"
args = ["run", "vision-mcp"]
cwd = "/absolute/path/to/shadow-vision"
env = { VISION_BACKEND = "ollama", VISION_MODEL = "qwen3-vl:2b", OLLAMA_URL = "http://127.0.0.1:11434/api/chat" }

# OpenAI-compatible example:
# env = { VISION_BACKEND = "openai_compatible", VISION_MODEL = "your-vision-model", OPENAI_API_BASE = "https://api.example.com/v1", OPENAI_API_KEY = "sk-...", OPENAI_MAX_TOKENS = "1024", OPENAI_MAX_TOKENS_FIELD = "max_tokens" }
