[project]
name = "vision-mcp"
version = "0.1.0"
description = "Local vision MCP server with pluggable backends (Ollama, OpenAI-compatible, Anthropic, Gemini)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0", "httpx[socks]>=0.27.0"]

[project.scripts]
vision-mcp = "vision_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_mcp"]

[tool.uv]
package = true
