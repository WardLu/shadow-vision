<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">影瞳 Shadow Vision 工作方式</title>
  <desc id="desc">纯文本 LLM 通过 MCP 调用 vision_ocr 与 vision_inspect 两个工具，解码到 Ollama、OpenAI-compatible、Anthropic 或 Gemini 四种视觉后端。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a4456"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <g id="client">
    <rect x="56" y="130" width="230" height="140" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
    <text x="76" y="166" font-size="24" font-weight="700" fill="#e8edf6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Text LLM</text>
    <text x="76" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">no built-in vision</text>
    <text x="76" y="234" font-size="18" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Claude · Codex · GPT</text>
  </g>

  <g id="server">
    <rect x="340" y="110" width="300" height="180" rx="14" fill="#12161f" stroke="#57d6c7" stroke-width="1.5"/>
    <text x="360" y="146" font-size="24" font-weight="700" fill="#e8edf6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Shadow Vision MCP</text>
    <text x="360" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">tools the model calls</text>
    <line x1="360" y1="188" x2="620" y2="188" stroke="#1f2733" stroke-width="1.5"/>
    <text x="360" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#57d6c7">vision_ocr</text>
    <text x="360" y="248" font-size="18" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">extract text from an image</text>
    <text x="360" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#57d6c7">vision_inspect</text>
    <text x="360" y="310" font-size="18" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">describe &amp; answer questions</text>
  </g>

  <g id="backends">
    <g transform="translate(700 40)">
      <rect width="210" height="120" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#57d6c7"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">Ollama</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">local · qwen3-vl</text>
      <text x="20" y="92" font-size="18" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">default backend</text>
    </g>
    <g transform="translate(930 40)">
      <rect width="210" height="120" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#7c8db5"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">OpenAI</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">compatible</text>
      <text x="20" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">LM Studio · vLLM</text>
    </g>
    <g transform="translate(700 180)">
      <rect width="210" height="120" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#7c8db5"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">Anthropic</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">Claude</text>
    </g>
    <g transform="translate(930 180)">
      <rect width="210" height="120" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#7c8db5"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">Gemini</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">Google</text>
    </g>
  </g>

  <g id="connections" stroke="#3a4456" stroke-width="2" fill="none">
    <path d="M286 200 H330" marker-end="url(#arrow)"/>
    <path d="M640 200 H670" marker-end="url(#arrow)"/>
    <path d="M670 100 V240"/>
    <path d="M670 100 H693" marker-end="url(#arrow)"/>
    <path d="M670 240 H693" marker-end="url(#arrow)"/>
  </g>
</svg>
