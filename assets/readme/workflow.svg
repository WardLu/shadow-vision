<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">影瞳 Shadow Vision 工作方式</title>
  <desc id="desc">纯文本 LLM 通过 MCP 调用 vision_ocr、vision_inspect、vision_annotate、vision_layout、vision_reconstruct、vision_compare，路由到 Ollama、OpenAI-compatible、Anthropic 或 Gemini 四种视觉后端。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a4456"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <g id="client">
    <rect x="56" y="150" width="230" height="130" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
    <text x="76" y="186" font-size="24" font-weight="700" fill="#e8edf6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Text LLM</text>
    <text x="76" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">no built-in vision</text>
    <text x="76" y="254" font-size="18" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Claude · Codex · GPT</text>
  </g>

  <g id="server">
    <rect x="340" y="70" width="300" height="290" rx="14" fill="#12161f" stroke="#57d6c7" stroke-width="1.5"/>
    <text x="360" y="106" font-size="24" font-weight="700" fill="#e8edf6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Shadow Vision MCP</text>
    <text x="360" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">tools the model calls</text>
    <line x1="360" y1="148" x2="620" y2="148" stroke="#1f2733" stroke-width="1.5"/>
    <!-- 六工具，两列三行 -->
    <text x="360" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#22d3ee">vision_ocr</text>
    <text x="360" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#a855f7">vision_annotate</text>
    <text x="360" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#22d3ee">vision_reconstruct</text>
    <text x="420" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#818cf8">vision_inspect</text>
    <text x="420" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#57d6c7">vision_layout</text>
    <text x="420" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#3b82f6">vision_compare</text>
  </g>

  <g id="backends">
    <g transform="translate(700 70)">
      <rect width="210" height="110" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#22d3ee"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">Ollama</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">local · qwen3-vl</text>
      <text x="20" y="92" font-size="18" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">default backend</text>
    </g>
    <g transform="translate(930 70)">
      <rect width="210" height="110" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#818cf8"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">OpenAI</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">compatible</text>
      <text x="20" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">LM Studio · vLLM</text>
    </g>
    <g transform="translate(700 200)">
      <rect width="210" height="110" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#a855f7"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">Anthropic</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">Claude</text>
    </g>
    <g transform="translate(930 200)">
      <rect width="210" height="110" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="5" fill="#3b82f6"/>
      <text x="36" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#e8edf6">Gemini</text>
      <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">Google</text>
    </g>
  </g>

  <g id="connections" stroke="#3a4456" stroke-width="2" fill="none">
    <path d="M286 215 H330" marker-end="url(#arrow)"/>
    <path d="M640 215 H670"/>
    <path d="M670 125 V255"/>
    <path d="M670 125 H693" marker-end="url(#arrow)"/>
    <path d="M670 125 H923" marker-end="url(#arrow)"/>
    <path d="M670 255 H693" marker-end="url(#arrow)"/>
    <path d="M670 255 H923" marker-end="url(#arrow)"/>
  </g>
</svg>
