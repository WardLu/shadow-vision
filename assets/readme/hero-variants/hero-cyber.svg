<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">影瞳 Shadow Vision — 赛博风 Hero</title>
  <desc id="desc">深色赛博风格：双瞳 LOGO + 大标题 + 终端窗口证明。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>

  <!-- 左侧：LOGO + 标题 -->
  <g transform="translate(72 72)">
    <!-- LOGO (80px) -->
    <g transform="scale(0.833)">
      <path d="M28 46 C28 36 40 28 56 28 C72 28 84 36 84 46 C84 56 72 64 56 64 C40 64 28 56 28 46 Z"
            fill="none" stroke="#a855f7" stroke-width="4" stroke-linejoin="round" opacity="0.42"/>
      <circle cx="56" cy="46" r="11" fill="#a855f7" opacity="0.18"/>
      <path d="M22 66 C22 52 36 42 54 42 C72 42 86 52 86 66 C86 80 72 90 54 90 C36 90 22 80 22 66 Z"
            fill="none" stroke="url(#brandGrad)" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="54" cy="66" r="13" fill="url(#irisGrad)" filter="url(#glow)"/>
      <circle cx="54" cy="66" r="13" stroke="#030712" stroke-width="2" opacity="0.5"/>
      <circle cx="54" cy="66" r="5.5" fill="#030712"/>
      <circle cx="50" cy="62" r="2.2" fill="#fff" opacity="0.9"/>
    </g>

    <!-- 元数据标签 -->
    <g transform="translate(110 8)">
      <rect width="180" height="22" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#94a3b8" letter-spacing="1">OPEN-SOURCE MCP SERVER</text>
    </g>

    <!-- 主标题 -->
    <text x="0" y="160" font-size="72" font-weight="700" fill="#e8edf6"
          font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Shadow Vision</text>
    <text x="0" y="202" font-size="28" font-weight="600" fill="#57d6c7"
          font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">影瞳 · 给文本模型一双眼睛</text>
    <text x="0" y="240" font-size="18" fill="#8a93a6"
          font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">开源 MCP 视觉服务 · OCR · 图像理解 · 截图复刻 · 多图对比</text>
  </g>

  <!-- 右侧：终端窗口 -->
  <g transform="translate(640 64)">
    <rect width="500" height="272" rx="12" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="6" fill="#febc2e"/>
    <circle cx="60" cy="20" r="6" fill="#28c840"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#1f2733" stroke-width="1.5"/>
    <text x="24" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#22d3ee">→ vision_ocr("receipt.png")</text>
    <text x="24" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e8edf6">"总计 ¥48.50 · 实收 ¥50.00"</text>
    <text x="24" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#22d3ee">→ vision_inspect("ui.jpg")</text>
    <text x="24" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e8edf6">"Hero 使用 3 列栅格，CTA 对比度偏低。"</text>
    <text x="24" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#22d3ee">→ vision_reconstruct("design.png")</text>
    <text x="24" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#a855f7">"已生成 HTML/CSS 代码，偏差 2.1%"</text>
    <text x="24" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#64748b">// 支持 Ollama · 智谱 · Anthropic · Gemini</text>
  </g>
</svg>
