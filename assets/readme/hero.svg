<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">影瞳 Shadow Vision — 给文本模型一双眼睛</title>
  <desc id="desc">开源 MCP 视觉服务，让纯文本 LLM 通过 vision_ocr 与 vision_inspect 获得图像理解、OCR 和视觉分析能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <g id="title-block">
    <g transform="translate(56 56)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="none" stroke="#57d6c7" stroke-width="2"/>
      <text x="30" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#8a93a6" letter-spacing="1">OPEN-SOURCE MCP · VISION SERVER</text>
    </g>
    <text x="56" y="150" font-size="72" font-weight="700" fill="#e8edf6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">Shadow Vision</text>
    <text x="56" y="192" font-size="28" font-weight="600" fill="#57d6c7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">影瞳</text>
    <text x="56" y="240" font-size="22" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">给纯文本 LLM 提供图像理解、OCR 与视觉分析，</text>
    <text x="56" y="272" font-size="22" fill="#c6cddb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">让 AI Agent 看见并理解真实世界的信息。</text>
    <text x="56" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6" letter-spacing="1">MIT LICENSE · PYTHON 3.11+ · MCP NATIVE</text>
  </g>

  <g id="terminal" transform="translate(700 36)">
    <rect width="460" height="288" rx="14" fill="#12161f" stroke="#1f2733" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="24" r="6" fill="#febc2e"/>
    <circle cx="64" cy="24" r="6" fill="#28c840"/>
    <text x="120" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8a93a6">~ uv run vision-mcp</text>
    <line x1="0" y1="48" x2="460" y2="48" stroke="#1f2733" stroke-width="1.5"/>
    <text x="24" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#57d6c7">&gt; vision_inspect("/tmp/ui.png")</text>
    <text x="24" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#e8edf6">"Hero uses a 3-column grid</text>
    <text x="24" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#e8edf6"> with a low-contrast CTA."</text>
    <text x="24" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#57d6c7">&gt; vision_ocr("/tmp/receipt.png")</text>
    <text x="24" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#e8edf6">"Total: $12.50 · Tax: $1.05"</text>
    <text x="24" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#8a93a6">"PAID · THANK YOU"</text>
  </g>
</svg>
