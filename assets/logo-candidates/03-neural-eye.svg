<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Vision 03 神经路径眼</title>
  <desc id="desc">两条 S 形神经路径构成眼睛，白色瞳孔节点 + 端点活动节点，呼应 Shadow Nexus 主标识。</desc>
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <g opacity="0.18">
    <path d="M27 62 C34 44 46 36 60 36 C74 36 86 44 93 62 C86 80 74 88 60 88 C46 88 34 80 27 62 Z" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" transform="translate(4 4)"/>
  </g>
  <path d="M27 62 C34 44 46 36 60 36 C74 36 86 44 93 62" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M27 62 C34 80 46 88 60 88 C74 88 86 80 93 62" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <circle cx="60" cy="62" r="8" fill="#fff" filter="url(#glow)"/>
  <circle cx="60" cy="62" r="3.5" fill="#030712"/>
  <circle cx="27" cy="62" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="93" cy="62" r="3" fill="#fff" opacity="0.9"/>
  <path d="M20 92 H40 M80 92 H100" stroke="#22d3ee" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
</svg>
