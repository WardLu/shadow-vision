<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Vision 07 双瞳叠加</title>
  <desc id="desc">主眼实色 + 阴影眼偏移描边叠加，直接诠释「Shadow + Vision」双重视觉。</desc>
  <defs>
    <linearGradient id="de" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="iris2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="deg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <!-- 阴影眼（偏移 + 描边） -->
  <path d="M24 68 C24 54 42 44 62 44 C82 44 100 54 100 68 C100 82 82 92 62 92 C42 92 24 82 24 68 Z" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round" opacity="0.35"/>
  <circle cx="62" cy="68" r="15" fill="#3b82f6" opacity="0.2"/>
  <!-- 主眼（实色渐变） -->
  <path d="M20 60 C20 46 38 36 58 36 C78 36 96 46 96 60 C96 74 78 84 58 84 C38 84 20 74 20 60 Z" fill="none" stroke="url(#de)" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="58" cy="60" r="16" fill="url(#iris2)" filter="url(#deg)"/>
  <circle cx="58" cy="60" r="16" stroke="#030712" stroke-width="2" opacity="0.5"/>
  <circle cx="58" cy="60" r="6.5" fill="#030712"/>
  <circle cx="53" cy="55" r="2.5" fill="#fff" opacity="0.9"/>
</svg>
