<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Vision 08 光圈叶片</title>
  <desc id="desc">6 片渐变光圈叶片组成虹膜，中心小孔为瞳孔，专业光学感。</desc>
  <defs>
    <linearGradient id="ap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="apg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <!-- 外圆环 -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.35"/>
  <!-- 6 片光圈叶片，绕中心旋转 -->
  <g filter="url(#apg)">
    <path d="M60 22 L66 60 L54 60 Z" fill="url(#ap)" opacity="0.9"/>
    <path d="M60 22 L66 60 L54 60 Z" fill="url(#ap)" opacity="0.75" transform="rotate(60 60 60)"/>
    <path d="M60 22 L66 60 L54 60 Z" fill="url(#ap)" opacity="0.6" transform="rotate(120 60 60)"/>
    <path d="M60 22 L66 60 L54 60 Z" fill="url(#ap)" opacity="0.7" transform="rotate(180 60 60)"/>
    <path d="M60 22 L66 60 L54 60 Z" fill="url(#ap)" opacity="0.55" transform="rotate(240 60 60)"/>
    <path d="M60 22 L66 60 L54 60 Z" fill="url(#ap)" opacity="0.8" transform="rotate(300 60 60)"/>
  </g>
  <!-- 中心孔 -->
  <circle cx="60" cy="60" r="10" fill="#030712"/>
  <circle cx="60" cy="60" r="10" stroke="#0F172A" stroke-width="2" opacity="0.8"/>
  <!-- 高光节点 -->
  <circle cx="56" cy="56" r="2.5" fill="#fff" opacity="0.8"/>
</svg>
