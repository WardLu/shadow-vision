<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Vision 07c 双瞳叠加·实心块</title>
  <desc id="desc">眼睛为实心渐变块而非描边，更有体量感，阴影眼为半透明实心。</desc>
  <defs>
    <linearGradient id="de" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="eyeFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="shadowFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="deg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <!-- 阴影眼（实心半透明 + 描边） -->
  <path d="M24 68 C24 54 42 44 62 44 C82 44 100 54 100 68 C100 82 82 92 62 92 C42 92 24 82 24 68 Z" fill="url(#shadowFill)" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" opacity="0.55"/>
  <!-- 主眼（深色实底 + 渐变描边） -->
  <path d="M20 60 C20 46 38 36 58 36 C78 36 96 46 96 60 C96 74 78 84 58 84 C38 84 20 74 20 60 Z" fill="url(#eyeFill)" stroke="url(#de)" stroke-width="5" stroke-linejoin="round"/>
  <!-- 虹膜 -->
  <g filter="url(#deg)">
    <circle cx="58" cy="60" r="16" fill="url(#de)"/>
  </g>
  <circle cx="58" cy="60" r="16" stroke="#030712" stroke-width="2" opacity="0.5"/>
  <circle cx="58" cy="60" r="6.5" fill="#030712"/>
  <!-- 高光 -->
  <circle cx="53" cy="55" r="2.8" fill="#fff" opacity="0.9"/>
  <circle cx="50" cy="52" r="1.2" fill="#fff" opacity="0.7"/>
</svg>
