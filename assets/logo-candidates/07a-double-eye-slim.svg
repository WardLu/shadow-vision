<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Vision 07a 双瞳叠加·细长版</title>
  <desc id="desc">更细长的杏仁眼 + 双层偏移，猫眼感更强，更锐利。</desc>
  <defs>
    <linearGradient id="de" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="iris2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="deg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <!-- 阴影眼（偏移 + 描边） -->
  <path d="M18 68 C18 52 36 40 62 40 C88 40 106 52 106 68 C106 84 88 96 62 96 C36 96 18 84 18 68 Z" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round" opacity="0.35"/>
  <circle cx="62" cy="68" r="13" fill="#3b82f6" opacity="0.15"/>
  <!-- 主眼（实色渐变） -->
  <path d="M14 60 C14 44 32 32 58 32 C84 32 102 44 102 60 C102 76 84 88 58 88 C32 88 14 76 14 60 Z" fill="none" stroke="url(#de)" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="58" cy="60" r="14" fill="url(#iris2)" filter="url(#deg)"/>
  <circle cx="58" cy="60" r="14" stroke="#030712" stroke-width="2" opacity="0.5"/>
  <circle cx="58" cy="60" r="5.5" fill="#030712"/>
  <circle cx="53.5" cy="55.5" r="2.2" fill="#fff" opacity="0.9"/>
</svg>
