<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Vision 02 扫描之眼</title>
  <desc id="desc">眼睛 + 虹膜上穿越的扫描虚线 + 四角检测框标尺，象征 OCR 与视觉检测。</desc>
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <path d="M28 54 C28 42 43 32 60 32 C77 32 92 42 92 54 C92 66 77 76 60 76 C43 76 28 66 28 54 Z" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="60" cy="54" r="14" fill="url(#irisGrad)" filter="url(#glow)"/>
  <circle cx="60" cy="54" r="14" stroke="#030712" stroke-width="2" opacity="0.55"/>
  <circle cx="60" cy="54" r="6" fill="#030712"/>
  <path d="M14 54 H40 M80 54 H106" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="54" x2="38" y2="54" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3" opacity="0.85"/>
  <line x1="82" y1="54" x2="102" y2="54" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3" opacity="0.85"/>
  <path d="M32 44 V38 H38 M88 38 H82 V44 M32 64 V70 H38 M88 70 H82 V64" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
